# Pinned so the project name — and therefore the data volume — does not change
# with the directory compose is run from. Without this, running from a git
# worktree silently creates a second, empty database.
name: dealswinhibid

services:
  # Production image, for a smoke test before deploying. Day-to-day development
  # runs `docker compose up -d db` for postgres and `pnpm dev` on the host:
  # the image contains no source and serves a built bundle, so there is nothing
  # for a file watcher to usefully sync into it.
  #   docker compose --profile full up --build
  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://windows_hawaii:${DB_PASSWORD:-changeme}@db:5432/windows_hawaii
      - SESSION_SECRET=${SESSION_SECRET:-your-session-secret-change-in-production}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=windows_hawaii
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
      - POSTGRES_DB=windows_hawaii
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U windows_hawaii -d windows_hawaii" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
